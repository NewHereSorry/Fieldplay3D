<!doctype html>
<meta charset="utf-8">
<title>fieldplay3d tests</title>
<style>body{background:#0d1117;color:#d6dde6;font:13px/1.5 Consolas,monospace;margin:16px}pre{white-space:pre-wrap}</style>
<pre id="out">running…</pre>
<canvas id="c" width="64" height="64" hidden></canvas>
<script type="module">
import { Engine } from '../js/gpu.js';
import { SIM, REN } from '../js/shaders.js';
import { PRESETS } from '../js/presets.js';
import { randomField } from '../js/random.js';
import { encodeState, decodeState, freshState } from '../js/state.js';
import { OrbitCamera } from '../js/camera.js';
import { Pulse, sampleAnalysis, decodeBands } from '../js/audio.js';
import * as library from '../js/library.js';

const out = document.getElementById('out');
let n = 0, m = 0;
const log = s => { out.textContent += s + '\n'; };
const check = (name, ok, detail = '') => { m++; if (ok) n++; log((ok ? 'PASS ' : 'FAIL ') + name + (ok ? '' : ': ' + detail)); };
const done = () => { log(`DONE ${n}/${m}`); document.title = `tests ${n}/${m}`; };
out.textContent = '';

// Uniform layouts follow WGSL's rules (vec3 aligns to 16, occupies 12).
const f = SIM.fields;
check('SIM layout', f.boundsMin.off === 0 && f.dt.off === 3 && f.boundsMax.off === 4 && f.time.off === 7 && f.cursor.off === 8 && f.count.off === 16 && f.fadeLife.off === 29 && f.beat.off === 30 && f.audio.off === 32 && f.bpm.off === 36 && f.cursorMode.off === 39 && f.cursorAxis.off === 40 && SIM.size === 176,
  JSON.stringify(Object.fromEntries(Object.entries(f).map(([k, v]) => [k, v.off]))) + ' size ' + SIM.size);
const g = REN.fields;
check('REN layout', g.viewProj.off === 0 && g.eye.off === 16 && g.fog.off === 19 && g.viewport.off === 20 && g.width.off === 22 && REN.size === 112, JSON.stringify(g) + ' size ' + REN.size);

// Share codec.
const S0 = freshState(); S0.cam = { th: 1, ph: 0.2, d: 5, t: [0, 0, 0], up: 'y' };
const enc = await encodeState(S0);
const S1 = await decodeState(enc);
check('state roundtrip', JSON.stringify(S0) === JSON.stringify(S1), enc.slice(0, 40));
check('share link is compact', enc.length < 1200, enc.length + ' chars');
check('share link is url-safe', /^[A-Za-z0-9_-]+$/.test(enc), enc.slice(0, 40));

// The library: the user's own fields, keyed by name, holding whole states.
{
  const before = localStorage.getItem('fieldplay3d.library');
  localStorage.removeItem('fieldplay3d.library');
  check('library: starts empty', library.list().length === 0);
  library.save('Zephyr', enc);
  const one = library.save('Anvil', 'other-state');
  check('library: save returns the entry', one && one.name === 'Anvil' && one.saved > 0, JSON.stringify(one));
  check('library: two saved, sorted by name', library.list().map(e => e.name).join() === 'Anvil,Zephyr', library.list().map(e => e.name).join());
  check('library: a saved state is the share string', library.find('Zephyr').state === enc);
  library.save('Zephyr', 'replaced');
  check('library: the same name replaces, never duplicates', library.list().length === 2 && library.find('Zephyr').state === 'replaced', library.list().length);
  check('library: a name is trimmed and an empty one refused', library.save('  Padded  ', 'x').name === 'Padded' && library.save('   ', 'x') === null);
  check('library: what was saved survives a fresh read', JSON.parse(localStorage.getItem('fieldplay3d.library')).length === 3);
  library.remove('Anvil'); library.remove('Padded');
  check('library: remove takes one out and leaves the rest', library.list().map(e => e.name).join() === 'Zephyr', library.list().map(e => e.name).join());
  check('library: an unknown name is null, not a throw', library.find('nope') === null);
  const decoded = await decodeState(library.find('Zephyr') && enc);
  check('library: a saved state decodes back to the state it came from', JSON.stringify(decoded) === JSON.stringify(S0));
  localStorage.setItem('fieldplay3d.library', '{ not an array');
  check('library: unreadable storage reads as empty', library.list().length === 0);
  library.remove('Zephyr');
  if (before === null) localStorage.removeItem('fieldplay3d.library'); else localStorage.setItem('fieldplay3d.library', before);
}

// Pulse: sampling a beat map at the player's clock.
{
  const bytes = new Uint8Array(800);
  for (let i = 0; i < 200; i++) { bytes[i * 4] = i; bytes[i * 4 + 1] = 255 - i; bytes[i * 4 + 2] = 128; bytes[i * 4 + 3] = 200; }
  const an = { rate: 50, n: 200, bpm: 120, beats: [0, 0.5, 1, 1.5, 2, 2.5, 3], bytes };
  const A = { bass: 0, mid: 0, high: 0, level: 0, beat: 0, phase: 0, bpm: 0, on: 0 };
  sampleAnalysis(an, 1.0, A);
  check('pulse: bands interpolate at the clock', Math.abs(A.bass - 50 / 255) < 1e-6 && Math.abs(A.high - 128 / 255) < 1e-6, JSON.stringify(A));
  check('pulse: on the beat the pulse is 1 and phase 0', Math.abs(A.beat - 1) < 1e-6 && A.phase === 0, A.beat + ' ' + A.phase);
  sampleAnalysis(an, 1.25, A);
  check('pulse: a quarter second on it has decayed, phase is half', Math.abs(A.beat - Math.exp(-0.25 / 0.12)) < 1e-6 && Math.abs(A.phase - 0.5) < 1e-6, A.beat + ' ' + A.phase);
  sampleAnalysis(an, 1.125, A);
  check('pulse: bands blend between frames', Math.abs(A.bass - 56.25 / 255) < 1e-6, A.bass);
  check('pulse: tempo is carried', A.bpm === 120 && A.on === 1, A.bpm);
  check('pulse: bands decode from base64', decodeBands(btoa(String.fromCharCode(1, 2, 3, 4))).join() === '1,2,3,4');
  const p = new Pulse(); p.source = 'auxcord';
  p._now = { playing: true, paused: false, position: 1.0, rate: 1, recv: 10 }; p._analysis = an;
  p.update(10.25);
  check('pulse: the clock runs on from the last poll', Math.abs(p.A.phase - 0.5) < 1e-6, p.A.phase);
  p._now.rate = 1.25; p.update(10.2);
  check('pulse: a nightcore rate runs the clock faster', Math.abs(p.A.phase - 0.5) < 1e-6, p.A.phase);
  p.offset = -0.25; p._now.rate = 1; p.update(10.25);
  check('pulse: the sync offset shifts the clock', Math.abs(p.A.phase - 0) < 1e-6 && Math.abs(p.A.beat - 1) < 1e-6, p.A.phase + ' ' + p.A.beat);
  p._now.paused = true; p.update(11);
  check('pulse: paused music decays instead of jumping', p.A.beat < 1 && p.A.on === 0, p.A.beat);
}

// Permissions: the page asks the browser for nothing until a press in the Pulse panel says so.
{
  const asked = [];
  const deny = kind => async () => { asked.push(kind); throw new DOMException('denied', 'NotAllowedError'); };
  Object.defineProperty(navigator, 'mediaDevices', {
    value: { getUserMedia: deny('mic'), getDisplayMedia: deny('capture') }, configurable: true });

  const p = new Pulse();
  p.update(1); p.update(2);
  check('permissions: a Pulse that was never started asks for nothing', asked.length === 0, asked.join());
  await p.setSource('off');
  check('permissions: selecting Off asks for nothing', asked.length === 0 && p.source === 'off', asked.join());

  const wanted = { ...freshState(), pulseSource: 2, pulseOn: true };
  const link = await encodeState(wanted);
  const back = await decodeState(link);
  check('permissions: a link cannot carry "already listening"', back.pulseOn === false && back.pulseSource === 2,
    JSON.stringify({ on: back.pulseOn, src: back.pulseSource }));
  check('permissions: decoding one asks for nothing', asked.length === 0, asked.join());
  library.save('Loud', link);
  const saved = await decodeState(library.find('Loud').state);
  check('permissions: a saved field cannot carry it either', saved.pulseOn === false, saved.pulseOn);
  library.remove('Loud');

  const started = await p.setSource('mic');
  check('permissions: only an explicit start asks, and a refusal is reported not thrown',
    asked.join() === 'mic' && started === false && p.status.startsWith('no permission'), asked.join() + ' | ' + p.status);
  const shared = await p.setSource('capture');
  check('permissions: the capture source asks the display, once', asked.join() === 'mic,capture' && shared === false, asked.join());
  p.stop();
  delete navigator.mediaDevices;
}

// Camera: the orbit target projects to the centre of the screen, in front of the camera.
const cam = new OrbitCamera(); cam.target = [1, 2, 3]; cam.update(1.5, 0);
const vp = cam.viewProj, t = cam.target;
const cx = vp[0] * t[0] + vp[4] * t[1] + vp[8] * t[2] + vp[12], cy = vp[1] * t[0] + vp[5] * t[1] + vp[9] * t[2] + vp[13], cw = vp[3] * t[0] + vp[7] * t[1] + vp[11] * t[2] + vp[15];
check('camera centres its target', Math.abs(cx / cw) < 1e-5 && Math.abs(cy / cw) < 1e-5 && cw > 0, `${cx / cw}, ${cy / cw}, w ${cw}`);
const hit = cam.cursorOnPlane(0, 0, 100, 100, [0, 0, 0]);
const rel = [hit[0] - t[0], hit[1] - t[1], hit[2] - t[2]];
check('cursor ray hits the target plane', Math.abs(rel[0] * cam.Z[0] + rel[1] * cam.Z[1] + rel[2] * cam.Z[2]) < 1e-6, rel.join(','));

// Which button drives what. A detached element, synthetic pointer events, one fresh camera each.
{
  const rig = () => {
    const el = document.createElement('div');
    Object.defineProperty(el, 'clientHeight', { value: 500 });
    el.setPointerCapture = () => {}; el.releasePointerCapture = () => {};   // no real pointer to capture
    const c = new OrbitCamera(); c.attach(el); c.update(1, 0);
    const send = (type, o) => el.dispatchEvent(new PointerEvent(type, {
      pointerId: o.id ?? 1, pointerType: o.pointerType ?? 'mouse', button: o.button ?? 0,
      buttons: o.buttons ?? 1, clientX: o.x ?? 0, clientY: o.y ?? 0,
      shiftKey: !!o.shift, ctrlKey: !!o.ctrl }));
    const drag = o => {
      send('pointerdown', { ...o, x: 100, y: 100 });
      const held = c.dragging;
      send('pointermove', { ...o, x: 200, y: 160 });
      send('pointerup', { ...o, x: 200, y: 160, buttons: 0 });
      return held;
    };
    return { c, drag, moved: () => ({ th: c.theta, ph: c.phi, t: [...c.target], d: c.dist }) };
  };
  const turned = (a, b) => Math.abs(a.th - b.th) > 1e-6 || Math.abs(a.ph - b.ph) > 1e-6;
  const panned = (a, b) => a.t.some((v, i) => Math.abs(v - b.t[i]) > 1e-6);

  let r = rig(), was = r.moved(); let held = r.drag({ button: 2, buttons: 2 });
  check('camera: right-drag orbits', turned(was, r.moved()) && !panned(was, r.moved()) && held, JSON.stringify(r.moved()));

  r = rig(); was = r.moved(); held = r.drag({ button: 0, buttons: 1 });
  check('camera: left-drag leaves the camera alone (it is the cursor\'s)', !turned(was, r.moved()) && !panned(was, r.moved()) && !held, JSON.stringify(r.moved()));

  r = rig(); was = r.moved(); held = r.drag({ button: 1, buttons: 4 });
  check('camera: middle-drag leaves the camera alone too', !turned(was, r.moved()) && !panned(was, r.moved()) && !held, JSON.stringify(r.moved()));

  r = rig(); was = r.moved(); held = r.drag({ button: 0, buttons: 1, shift: true });
  check('camera: shift-drag pans', panned(was, r.moved()) && !turned(was, r.moved()) && held, JSON.stringify(r.moved()));

  r = rig(); was = r.moved(); r.drag({ button: 0, buttons: 1, ctrl: true });
  check('camera: ctrl-drag pans as well', panned(was, r.moved()) && !turned(was, r.moved()), JSON.stringify(r.moved()));

  r = rig(); was = r.moved(); held = r.drag({ button: 0, buttons: 1, pointerType: 'touch' });
  check('camera: one finger still orbits, having no buttons to hold', turned(was, r.moved()) && held, JSON.stringify(r.moved()));

  r = rig(); was = r.moved();
  r.drag({ button: 2, buttons: 2 });
  check('camera: dragging is false again once the button is up', r.c.dragging === false, r.c.dragging);
}

// GPU.
let engine;
try { engine = await Engine.create(document.getElementById('c')); check('WebGPU device', true); }
catch (e) { check('WebGPU device', false, e.message); done(); throw e; }
log('adapter: ' + engine.info + ' · max particles ' + engine.maxCount.toLocaleString());
engine.setCount(1024);

for (const p of PRESETS) {
  const r = await engine.compile(p.code);
  check('preset ' + p.id, r.ok, r.errors.map(e => `L${e.line}:${e.col} ${e.message}`).join(' | '));
}
let bad = 0; const details = [];
for (let i = 0; i < 40; i++) {
  const code = randomField(1000 + i);
  const r = await engine.compile(code);
  if (!r.ok) { bad++; details.push(code + r.errors.map(e => e.message).join(';')); }
}
check('40 random fields compile', bad === 0, details.slice(0, 2).join('\n'));

const bad1 = await engine.compile('fn get_velocity(p: vec3f) -> vec3f {\n  let a = 1.0;\n  return vec3f(a, b, 0.0);\n}\n');
check('error line maps to the editor', !bad1.ok && bad1.errors[0].line === 3, JSON.stringify(bad1.errors));
const cc = await engine.compile('fn get_velocity(p: vec3f) -> vec3f { return p; }\nfn get_color(p: vec3f, v: vec3f) -> vec3f { return vec3f(1.0); }');
check('custom get_color compiles', cc.ok, JSON.stringify(cc.errors));
const nofn = await engine.compile('// nothing here');
check('missing get_velocity is an error', !nofn.ok, JSON.stringify(nofn.errors));

// Run the default preset and read the particles back.
await engine.compile(PRESETS[0].code);
const S = freshState(); S.colorLin = [1, 1, 1]; S.bgLin = [0, 0, 0];
engine.resize(64, 64);
const cam2 = new OrbitCamera(); cam2.dist = 6; cam2.update(1, 0);
const ctl = { cursor: [0, 0, 0], cursorDown: 0, motion: 0, paused: false, dpr: 1 };
for (let i = 0; i < 30; i++) engine.frame(S, cam2, ctl);
const dev = engine.device;
const rb = dev.createBuffer({ size: 1024 * 16, usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ });
const rbc = dev.createBuffer({ size: 1024 * 16, usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ });
const tb = dev.createBuffer({ size: 64 * 64 * 8, usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ });
const e2 = dev.createCommandEncoder();
e2.copyBufferToBuffer(engine.posB, 0, rb, 0, 1024 * 16);
e2.copyBufferToBuffer(engine.colB, 0, rbc, 0, 1024 * 16);
e2.copyTextureToBuffer({ texture: engine.trail[engine.cur ^ 1] }, { buffer: tb, bytesPerRow: 64 * 8 }, [64, 64]);
dev.queue.submit([e2.finish()]);
await Promise.all([rb.mapAsync(GPUMapMode.READ), rbc.mapAsync(GPUMapMode.READ), tb.mapAsync(GPUMapMode.READ)]);
const pos = new Float32Array(rb.getMappedRange()), col = new Float32Array(rbc.getMappedRange()), tex = new Uint16Array(tb.getMappedRange());
let inside = 0, aged = 0, finite = 0, lit = 0, distinct = new Set();
const h = S.box.s[0] / 2;
for (let i = 0; i < 1024; i++) {
  const x = pos[i * 4], y = pos[i * 4 + 1], z = pos[i * 4 + 2], age = pos[i * 4 + 3];
  if (isFinite(x + y + z)) finite++;
  if (Math.abs(x) <= h && Math.abs(y) <= h && Math.abs(z) <= h) inside++;
  if (age > 0) aged++;
  if (col[i * 4] > 0 || col[i * 4 + 1] > 0 || col[i * 4 + 2] > 0) lit++;
  distinct.add(x.toFixed(3));
}
let texel = 0; for (let i = 0; i < tex.length; i++) if (tex[i] !== 0 && tex[i] !== 0x3c00) texel++;
check('particles finite', finite === 1024, finite);
check('particles inside the box', inside === 1024, inside);
check('particles aged (all but those reborn on the last step)', aged > 1024 * 0.97, aged);
check('particles spread out', distinct.size > 780, distinct.size + ' distinct x at 1e-3 (1024 draws over 3000 bins → ~867)');
check('particles coloured', lit === 1024, lit);
check('trail texture holds light', texel > 100, texel + ' nonzero words');
check('sim time advanced (the reset frame does not integrate)', Math.abs(engine.time - 29 * S.dt) < 1e-6, engine.time);

// The cursor: hovering bends the flow toward the pointer. Same field, same frames, cursor off
// against cursor pulling — how many particles end up near the point it sits on.
{
  const read = dev.createBuffer({ size: 1024 * 16, usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ });
  const near = async (mode, force, sign = 1) => {
    const C = freshState(); C.colorLin = [1, 1, 1]; C.bgLin = [0, 0, 0];
    C.cursorForce = force; C.cursorRadius = 1.5;
    const cam3 = new OrbitCamera(); cam3.dist = 6; cam3.update(1, 0);
    const c = { cursor: [0, 0, 0], cursorDown: 0, motion: 0, paused: false, dpr: 1, cursorMode: mode, cursorSign: sign };
    engine.seed = 1; engine.reset();
    for (let i = 0; i < 240; i++) engine.frame(C, cam3, c);
    const e3 = dev.createCommandEncoder();
    e3.copyBufferToBuffer(engine.posB, 0, read, 0, 1024 * 16);
    dev.queue.submit([e3.finish()]);
    await read.mapAsync(GPUMapMode.READ);
    const q = new Float32Array(read.getMappedRange());
    let hits = 0, worst = 0;
    for (let i = 0; i < 1024; i++) {
      const d = Math.hypot(q[i * 4], q[i * 4 + 1], q[i * 4 + 2]);
      if (d < 0.5) hits++;
      worst = Math.max(worst, d);
    }
    read.unmap();
    return { hits, worst };
  };
  const off = await near(0, 1.5), pull = await near(1, 4), push = await near(2, 4);
  check('cursor: pulling gathers particles at the pointer', pull.hits > off.hits * 2, `${pull.hits} near vs ${off.hits} with it off`);
  check('cursor: pushing clears them away from it', push.hits < off.hits, `${push.hits} near vs ${off.hits} with it off`);
  check('cursor: the force never throws a particle out of the box', pull.worst < 2.61 && push.worst < 2.61, `${pull.worst.toFixed(2)} / ${push.worst.toFixed(2)} from centre, box half-diagonal 2.60`);
  const swirl = await near(3, 4);
  check('cursor: swirling keeps them in the box too', swirl.worst < 2.61 && isFinite(swirl.worst), swirl.worst);
  // The middle button is the left one with the sign flipped: pulling inverted must read as pushing.
  const inverted = await near(1, 4, -1);
  check('cursor: a negated force turns the pull into a push', inverted.hits < off.hits && Math.abs(inverted.hits - push.hits) < off.hits, `${inverted.hits} near, push was ${push.hits}, off was ${off.hits}`);
  const back = await near(2, 4, -1);
  check('cursor: negating a push pulls instead', back.hits > off.hits * 2, `${back.hits} near vs ${off.hits} with it off`);
}
done();
</script>
